<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WAGERLY - Predict</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="topbar">
    <div class="logo"><a href="landing_page.html">Wagerly</a></div>
    <nav>
      <a href="landing_page.html">Home</a>
      <a href="landing_page.html#about">About</a>
      <a href="landing_page.html#contact" class="btn-nav">Contact</a>
    </nav>
  </header>

  <main class="predict-main">
    <h1 class="predict-title">SELECT YOUR <span class="accent">MATCHUP</span></h1>

    <div class="arena-container">
      <!-- Left Fighter (Team 1) -->
      <div class="fighter-side fighter-left">
        <div class="fighter-label">TEAM 1</div>
        <div class="fighter-portrait" id="fighter1">
          <span class="empty-slot">?</span>
        </div>
        <div class="fighter-name" id="fighter1-name">SELECT</div>
      </div>

      <!-- Center Grid -->
      <div class="team-grid-wrapper">
        <div class="team-grid" id="teamGrid">
          <!-- Teams will be inserted by JS -->
        </div>
        <p class="select-hint" id="selectHint">Click a team to select for <span class="accent">TEAM 1</span></p>
      </div>

      <!-- Right Fighter (Team 2) -->
      <div class="fighter-side fighter-right">
        <div class="fighter-label">TEAM 2</div>
        <div class="fighter-portrait" id="fighter2">
          <span class="empty-slot">?</span>
        </div>
        <div class="fighter-name" id="fighter2-name">SELECT</div>
      </div>
    </div>

    <div class="vs-divider">
      <span class="vs-text">VS</span>
    </div>

    <button class="predict-btn" id="predictBtn">PREDICT WINNER</button>

    <!-- Result -->
    <div class="result-container" id="result" style="display: none;">
      <h2 class="result-title">WINNER</h2>
      <div class="winner-name" id="winner-name"></div>
    </div>
  </main>

  <footer class="footer">
    <p>© <span id="year"></span> GDG Collab Group.</p>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    const teams = [
      { abbr: 'ARI', name: 'Arizona Cardinals' },
      { abbr: 'ATL', name: 'Atlanta Falcons' },
      { abbr: 'BAL', name: 'Baltimore Ravens' },
      { abbr: 'BUF', name: 'Buffalo Bills' },
      { abbr: 'CAR', name: 'Carolina Panthers' },
      { abbr: 'CHI', name: 'Chicago Bears' },
      { abbr: 'CIN', name: 'Cincinnati Bengals' },
      { abbr: 'CLE', name: 'Cleveland Browns' },
      { abbr: 'DAL', name: 'Dallas Cowboys' },
      { abbr: 'DEN', name: 'Denver Broncos' },
      { abbr: 'DET', name: 'Detroit Lions' },
      { abbr: 'GB', name: 'Green Bay Packers' },
      { abbr: 'HOU', name: 'Houston Texans' },
      { abbr: 'IND', name: 'Indianapolis Colts' },
      { abbr: 'JAX', name: 'Jacksonville Jaguars' },
      { abbr: 'KC', name: 'Kansas City Chiefs' },
      { abbr: 'LV', name: 'Las Vegas Raiders' },
      { abbr: 'LAC', name: 'Los Angeles Chargers' },
      { abbr: 'LAR', name: 'Los Angeles Rams' },
      { abbr: 'MIA', name: 'Miami Dolphins' },
      { abbr: 'MIN', name: 'Minnesota Vikings' },
      { abbr: 'NE', name: 'New England Patriots' },
      { abbr: 'NO', name: 'New Orleans Saints' },
      { abbr: 'NYG', name: 'New York Giants' },
      { abbr: 'NYJ', name: 'New York Jets' },
      { abbr: 'PHI', name: 'Philadelphia Eagles' },
      { abbr: 'PIT', name: 'Pittsburgh Steelers' },
      { abbr: 'SF', name: 'San Francisco 49ers' },
      { abbr: 'SEA', name: 'Seattle Seahawks' },
      { abbr: 'TB', name: 'Tampa Bay Buccaneers' },
      { abbr: 'TEN', name: 'Tennessee Titans' },
      { abbr: 'WAS', name: 'Washington Commanders' }
    ];

    let selectedTeam1 = null;
    let selectedTeam2 = null;
    let selectingFor = 1; // 1 or 2

    const grid = document.getElementById('teamGrid');
    const hint = document.getElementById('selectHint');

    // Build team grid
    teams.forEach(team => {
      const card = document.createElement('div');
      card.className = 'team-card';
      card.dataset.abbr = team.abbr;
      card.dataset.name = team.name;
      card.innerHTML = `
        <img src="https://a.espncdn.com/i/teamlogos/nfl/500/${team.abbr.toLowerCase()}.png" alt="${team.name}" />
      `;
      card.addEventListener('click', () => selectTeam(team, card));
      grid.appendChild(card);
    });

    function selectTeam(team, card) {
      // Check if clicking on already selected team (deselect)
      if (selectedTeam1?.abbr === team.abbr) {
        // Deselect team 1
        selectedTeam1 = null;
        card.classList.remove('selected-1');
        document.getElementById('fighter1').innerHTML = `<span class="empty-slot">?</span>`;
        document.getElementById('fighter1-name').textContent = 'SELECT';
        selectingFor = 1;
        hint.innerHTML = 'Click a team to select for <span class="accent">TEAM 1</span>';
        document.getElementById('result').style.display = 'none';
        document.getElementById('result').classList.remove('show');
        return;
      }
      
      if (selectedTeam2?.abbr === team.abbr) {
        // Deselect team 2
        selectedTeam2 = null;
        card.classList.remove('selected-2');
        document.getElementById('fighter2').innerHTML = `<span class="empty-slot">?</span>`;
        document.getElementById('fighter2-name').textContent = 'SELECT';
        selectingFor = 2;
        hint.innerHTML = 'Click a team to select for <span class="accent">TEAM 2</span>';
        document.getElementById('result').style.display = 'none';
        document.getElementById('result').classList.remove('show');
        return;
      }

      // Remove previous selection highlight for current selecting slot
      document.querySelectorAll('.team-card').forEach(c => {
        if (selectingFor === 1) {
          c.classList.remove('selected-1');
        } else {
          c.classList.remove('selected-2');
        }
      });

      if (selectingFor === 1) {
        selectedTeam1 = team;
        card.classList.add('selected-1');
        
        // Update left fighter
        document.getElementById('fighter1').innerHTML = `
          <img src="https://a.espncdn.com/i/teamlogos/nfl/500/${team.abbr.toLowerCase()}.png" alt="${team.name}" />
        `;
        document.getElementById('fighter1-name').textContent = team.name;
        
        // Switch to selecting team 2 if not already selected
        if (!selectedTeam2) {
          selectingFor = 2;
          hint.innerHTML = 'Click a team to select for <span class="accent">TEAM 2</span>';
        }
      } else {
        selectedTeam2 = team;
        card.classList.add('selected-2');
        
        // Update right fighter
        document.getElementById('fighter2').innerHTML = `
          <img src="https://a.espncdn.com/i/teamlogos/nfl/500/${team.abbr.toLowerCase()}.png" alt="${team.name}" />
        `;
        document.getElementById('fighter2-name').textContent = team.name;
        
        // Switch back to team 1 if not already selected
        if (!selectedTeam1) {
          selectingFor = 1;
          hint.innerHTML = 'Click a team to select for <span class="accent">TEAM 1</span>';
        }
      }

      // Hide result when changing teams
      document.getElementById('result').style.display = 'none';
      document.getElementById('result').classList.remove('show');
    }

    // Predict winner (hardcoded to select Team 1 / left team)
    document.getElementById('predictBtn').addEventListener('click', function() {
      if (!selectedTeam1 || !selectedTeam2) {
        alert('Please select both teams!');
        return;
      }

      // Show result with animation
      const resultDiv = document.getElementById('result');
      const winnerName = document.getElementById('winner-name');
      
      resultDiv.style.display = 'block';
      resultDiv.classList.remove('show');
      
      // Dramatic delay then reveal winner (always team 1 - the left team)
      setTimeout(() => {
        winnerName.textContent = selectedTeam1.name;
        resultDiv.classList.add('show');
      }, 500);
    });
  </script>
</body>
</html>
